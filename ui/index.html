<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Backgammon</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:," />

    <style>
      body {
        margin: 0;
        /* darker 007-ish green */
        background: #0b1a0f;
      }
    </style>

    <!-- 1) Firebase init + expose bindings (NO sign-in here) -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      import {
        getFirestore,
        collection,
        doc,
        getDocs,
        getDoc,
        addDoc,
        setDoc,
        updateDoc,
        onSnapshot,
        serverTimestamp,
        query,
        where,
        limit
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCn7ZyEKhQy30ifch4oql8E3uL81O1_Yz0",
        authDomain: "backgammon-game1.firebaseapp.com",
        projectId: "backgammon-game1",
        storageBucket: "backgammon-game1.firebasestorage.app",
        messagingSenderId: "607056940980",
        appId: "1:607056940980:web:4eda69927ea168b0faace1"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      window.__firebaseBindings = {
        app,
        auth,
        db,
        signInAnonymously,
        collection,
        doc,
        getDocs,
        getDoc,
        addDoc,
        setDoc,
        updateDoc,
        onSnapshot,
        serverTimestamp,
        query,
        where,
        limit
      };

      console.log("[firebase:init] bindings ready");
    </script>

    <!-- 2) firebaseEnv shim -->
    <script defer src="firebase_debug.js"></script>

    <!-- 3) quickmatch + room sync -->
    <script defer src="quickmatch.js"></script>

    <!-- 4) js_of_ocaml output -->
    <script defer src="main.js"></script>
  </head>

  <body>
    <!-- Keep it (optional), but we do NOT use JS lobby rendering -->
    <div id="lobby-root" style="display:none"></div>

    <!-- OCaml app mounts here -->
    <div id="app"></div>
  </body>
</html>
