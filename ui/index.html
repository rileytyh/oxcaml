<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Backgammon</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:," />

    <style>
      body {
        margin: 0;
        background: #0b1a0f; /* darker 007-ish green */
      }
    </style>

    <!-- 1) Firebase init + expose bindings (NO auto sign-in here) -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import {
        getAuth,
        signInAnonymously,
        onAuthStateChanged
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      import {
        getFirestore,
        collection,
        doc,
        getDocs,
        getDoc,
        addDoc,
        setDoc,
        updateDoc,
        onSnapshot,
        serverTimestamp,
        query,
        where,
        limit
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      // Analytics
      import {
        getAnalytics,
        logEvent
      } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCn7ZyEKhQy30ifch4oql8E3uL81O1_Yz0",
        authDomain: "backgammon-game1.firebaseapp.com",
        projectId: "backgammon-game1",
        storageBucket: "backgammon-game1.firebasestorage.app",
        messagingSenderId: "607056940980",
        appId: "1:607056940980:web:4eda69927ea168b0faace1"

        // ✅ 如果你 Firebase Console 给了 measurementId，建议加上这一行（有就加，没有也能跑）：
        // measurementId: "G-XXXXXXXXXX"
      };

      // Init core
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      // Init analytics (可能在某些环境不可用；不可用就优雅降级)
      let analytics = null;
      try {
        analytics = getAnalytics(app);
      } catch (e) {
        console.warn("[firebase] analytics unavailable:", e?.message || e);
      }

      // Expose bindings for firebase_debug.js / quickmatch.js / analytics.js
      window.__firebaseBindings = {
        app,
        auth,
        db,

        // auth
        signInAnonymously,
        onAuthStateChanged,

        // firestore
        collection,
        doc,
        getDocs,
        getDoc,
        addDoc,
        setDoc,
        updateDoc,
        onSnapshot,
        serverTimestamp,
        query,
        where,
        limit,

        // analytics
        analytics,
        analyticsLogEvent: (name, params = {}) => {
          if (!analytics) return;
          try {
            logEvent(analytics, name, params || {});
          } catch {}
        }
      };

      // ---- HW12: acquisition params from URL (utm_* / gclid / fbclid) ----
      try {
        const u = new URL(window.location.href);
        const qp = u.searchParams;

        const utm_source = qp.get("utm_source");
        const utm_medium = qp.get("utm_medium");
        const utm_campaign = qp.get("utm_campaign");
        const utm_content = qp.get("utm_content");
        const utm_term = qp.get("utm_term");

        const gclid = qp.get("gclid");
        const fbclid = qp.get("fbclid");

        let source = "unknown";
        if (utm_source) source = utm_source;
        else if (gclid) source = "google";
        else if (fbclid) source = "facebook";

        // expose to other scripts
        window.__acq = {
          source,
          utm_source,
          utm_medium,
          utm_campaign,
          utm_content,
          utm_term,
          gclid: gclid ? "1" : "",
          fbclid: fbclid ? "1" : "",
          path: window.location.pathname || "",
        };

        // Optional: remove click ids (avoid repeated reprocessing)
        // if (gclid || fbclid || utm_source) history.replaceState({}, "", u.pathname + u.hash);
      } catch {}

      console.log("[firebase:init] bindings ready (analytics:", !!analytics, ")");
    </script>

    <!-- 2) firebaseEnv shim (NO auto sign-in) -->
    <script defer src="firebase_debug.js"></script>

    <!-- 2.5) analytics bridge (sets firebaseEnv._analyticsLog / logEventWith) -->
    <script defer src="analytics.js"></script>

    <!-- 3) quickmatch + room sync + invites -->
    <script defer src="quickmatch.js"></script>

    <!-- 4) js_of_ocaml output -->
    <script defer src="main.js"></script>
  </head>

  <body>
    <!-- optional unused root -->
    <div id="lobby-root" style="display: none"></div>

    <!-- OCaml app mounts here -->
    <div id="app"></div>
  </body>
</html>
